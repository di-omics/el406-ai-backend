[project]
name = "el406-ai-backend"
version = "0.1.0"
description = "EL406 AI-native backend: safety-gated PyLabRobot orchestration for cellular assays"
readme = "el406_backend/README.md"
requires-python = ">=3.11"
dependencies = [
  "pylabrobot==0.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["el406_backend*"]
